# The public demo projects, read by the DataTug browser straight from GitHub:
# this repository's root is a small inGitDB database. Queries name this
# descriptor in federation.ingitdbSources.
format: ovdb-manifest/draft-1
id: public-projects
title: Demo projects
database: {id: public-projects, schema_mode: strict}
storage:
  engine: ingitdb
  github:
    repository: datatug/my-data
    revision: 66a3226cb740fbdd8b8fc03fca725f9dccf3ece2
    cacheControl: public, max-age=31536000, immutable
schemas:
  collections:
    demo_projects:
      fields:
        title: {type: string}
        storage: {type: string}
        description: {type: string}
    demo_project_queries:
      fields:
        project: {type: string}
        query: {type: string}
        title: {type: string}
    demo_project_boards:
      fields:
        project: {type: string}
        board: {type: string}
        title: {type: string}
